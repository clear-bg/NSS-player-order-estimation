skinparam ClassBorderThickness 2.5
skinparam ObjectBackgroundColor #1D1D1D
skinparam ObjectBorderColor #846DC3
skinparam ObjectBorderThickness 2.5
skinparam ObjectStereotypeFontColor #846DC3
skinparam ObjectFontColor #846DC3
skinparam ObjectAttributeFontColor #846DC3
skinparam ArrowColor #5A97FF
skinparam ArrowThickness 2.5
skinparam CircledCharacterFontColor #GhostWhite
skinparam CircledCharacterRadius 15
skinparam CircledCharacterFontSize 20






entity     "   <b><color:#EEEEEE>Aliases</b>   \n   <size:16><color:#EEEEEE>プレイヤー別名を管理するテーブル</size>   " as Aliases {
    +<color:#C88049>id  </color><i><color:#709AE0>INTEGER</i>
