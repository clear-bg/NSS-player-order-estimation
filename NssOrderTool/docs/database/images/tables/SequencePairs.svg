@startuml
!include ../../helper.puml

entity table_desc(SequencePairs, 出現順序ペアの頻度統計テーブル) {
    pk(predecessor_id, TEXT)
    pk(successor_id, TEXT)
    col(created_at, TEXT, '作成日時')
    col(frequency, INTEGER, '累計出現頻度')
    col(is_deleted, INTEGER, '論理削除フラグ')
    col(updated_at, TEXT, '更新日時')
}
@enduml

@startuml
hide circle 
skinparam shadowing false
skinparam RoundCorner 15
skinparam padding 1.3
skinparam DefaultFontName Meiryo
skinparam BackgroundColor #222222
skinparam PackageBackgroundColor #1F1F1F
skinparam PackageBorderColor #5EBED0
skinparam PackageBorderThickness 2.5
skinparam PackageFontColor #5EBED0
skinparam PackageFontSize 20
skinparam ClassHeaderBackgroundColor #345998
skinparam ClassFontSize 18
skinparam ClassBackgroundColor #1D1D1D
skinparam ClassBorderColor #6489C6
skinparam ClassBorderThickness 2.5
skinparam ObjectBackgroundColor #1D1D1D
skinparam ObjectBorderColor #846DC3
skinparam ObjectBorderThickness 2.5
skinparam ObjectStereotypeFontColor #846DC3
skinparam ObjectFontColor #846DC3
skinparam ObjectAttributeFontColor #846DC3
skinparam ArrowColor #5A97FF
skinparam ArrowThickness 2.5
skinparam CircledCharacterFontColor #GhostWhite
skinparam CircledCharacterRadius 15
skinparam CircledCharacterFontSize 20






entity     "   <b><color:#EEEEEE>SequencePairs</b>   \n   <size:16><color:#EEEEEE>出現順序ペアの頻度統計テーブル</size>   " as SequencePairs {
    +<color:#C88049>predecessor_id  </color><i><color:#709AE0>TEXT</i>
    +<color:#C88049>successor_id  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>created_at  </color><color:#D4B31D>作成日時  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>frequency  </color><color:#D4B31D>累計出現頻度  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>is_deleted  </color><color:#D4B31D>論理削除フラグ  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>updated_at  </color><color:#D4B31D>更新日時  </color><i><color:#709AE0>TEXT</i>
}
@enduml

