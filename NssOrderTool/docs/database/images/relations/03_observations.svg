package " 観測データ情報 " {

entity     "   <b><color:#EEEEEE>Observations</b>   \n   <size:16><color:#EEEEEE>プレイヤーの出現順序などの観測データ（親レコード）を管理するテーブル</size>   " as Observations {
    +<color:#C88049>observation_id  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>created_at  </color><color:#D4B31D>レコード作成日時  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>is_deleted  </color><color:#D4B31D>論理削除フラグ（trueで削除済み）  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>observation_time  </color><color:#D4B31D>観測が実行・記録された日時  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>updated_at  </color><color:#D4B31D>レコード最終更新日時  </color><i><color:#709AE0>TEXT</i>
}

entity     "   <b><color:#EEEEEE>ObservationDetails</b>   \n   <size:16><color:#EEEEEE>1回の観測データに含まれる個々のプレイヤーとその順序（子レコード）を管理するテーブル</size>   " as ObservationDetails {
    +<color:#C88049>detail_id  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>created_at  </color><color:#D4B31D>レコード作成日時  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>is_deleted  </color><color:#D4B31D>論理削除フラグ（trueで削除済み）  </color><i><color:#709AE0>INTEGER</i>
    #<color:#C88049>observation_id  </color><i><color:#709AE0>INTEGER</i><i><color:#A077E5></i>
    <color:#84B9EE>order_index  </color><color:#D4B31D>観測されたプレイヤーの順番・配置インデックス（0, 1, 2...）  </color><i><color:#709AE0>INTEGER</i>
    #<color:#C88049>player_id  </color><i><color:#709AE0>TEXT</i><i><color:#A077E5></i>
    <color:#84B9EE>updated_at  </color><color:#D4B31D>レコード最終更新日時  </color><i><color:#709AE0>TEXT</i>
}

entity     "   <b><color:#EEEEEE>SequencePairs</b>   \n   <size:16><color:#EEEEEE>プレイヤーの出現順序ペア（前後関係）の出現頻度統計</size>   " as SequencePairs {
    +<color:#C88049>predecessor_id  </color><i><color:#709AE0>TEXT</i>
    +<color:#C88049>successor_id  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>created_at  </color><color:#D4B31D>レコード作成日時  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>frequency  </color><color:#D4B31D>この順序ペアが観測された累計頻度（回数）  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>is_deleted  </color><color:#D4B31D>論理削除フラグ（trueで削除済み）  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>updated_at  </color><color:#D4B31D>レコード最終更新日時  </color><i><color:#709AE0>TEXT</i>
}
}

Observations ||-d-o{ ObservationDetails

