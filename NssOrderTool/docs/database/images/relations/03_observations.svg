package " 観測データ情報 " {

entity     "   <b><color:#EEEEEE>Observations</b>   \n   <size:16><color:#EEEEEE>プレイヤー出現順序の観測データを管理するテーブル</size>   " as Observations {
    +<color:#C88049>observation_id  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>created_at  </color><color:#D4B31D>作成日時  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>is_deleted  </color><color:#D4B31D>論理削除フラグ  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>observation_time  </color><color:#D4B31D>観測日時  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>updated_at  </color><color:#D4B31D>更新日時  </color><i><color:#709AE0>TEXT</i>
}

entity     "   <b><color:#EEEEEE>ObservationDetails</b>   \n   <size:16><color:#EEEEEE>観測データの明細（プレイヤー順序）を管理するテーブル</size>   " as ObservationDetails {
    +<color:#C88049>detail_id  </color><i><color:#709AE0>INTEGER</i>
    #<color:#C88049>observation_id  </color><i><color:#709AE0>INTEGER</i><i><color:#A077E5></i>
    #<color:#C88049>player_id  </color><i><color:#709AE0>TEXT</i><i><color:#A077E5></i>
    <color:#84B9EE>created_at  </color><color:#D4B31D>作成日時  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>is_deleted  </color><color:#D4B31D>論理削除フラグ  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>order_index  </color><color:#D4B31D>出現順序（0,1,2...）  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>updated_at  </color><color:#D4B31D>更新日時  </color><i><color:#709AE0>TEXT</i>
}

entity     "   <b><color:#EEEEEE>SequencePairs</b>   \n   <size:16><color:#EEEEEE>出現順序ペアの頻度統計テーブル</size>   " as SequencePairs {
    +<color:#C88049>predecessor_id  </color><i><color:#709AE0>TEXT</i>
    +<color:#C88049>successor_id  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>created_at  </color><color:#D4B31D>作成日時  </color><i><color:#709AE0>TEXT</i>
    <color:#84B9EE>frequency  </color><color:#D4B31D>累計出現頻度  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>is_deleted  </color><color:#D4B31D>論理削除フラグ  </color><i><color:#709AE0>INTEGER</i>
    <color:#84B9EE>updated_at  </color><color:#D4B31D>更新日時  </color><i><color:#709AE0>TEXT</i>
}
}

Observations ||-d-o{ ObservationDetails

